<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">


<head>

    <title>Expenses</title>


    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">
    <link rel="stylesheet"
          th:href="@{/css/style.css}">


</head>
<form
        th:action="@{/expenses/search}"
        method="get"
        class="row mb-4">


    <div class="col-md-4">

        <input
                type="text"
                name="category"
                class="form-control"
                placeholder="Search Category">

    </div>


    <div class="col-md-2">

        <button class="btn btn-primary">

            Search

        </button>
        <button id="themeToggle"
                class="btn btn-warning">

            🌙

        </button>

    </div>


    <div class="col-md-2">

        <a href="/expenses"
           class="btn btn-secondary">

            Reset

        </a>

    </div>


</form>

<body class="bg-light">


<div class="container mt-5">



    <div class="d-flex justify-content-between mb-3">


        <h2>
            My Expenses
        </h2>


        <a href="/expenses/add"
           class="btn btn-primary">

            + Add Expense

        </a>


    </div>





    <table class="table table-bordered table-striped">


        <thead class="table-dark">


        <tr>

            <th>Title</th>

            <th>Amount</th>

            <th>Category</th>

            <th>Date</th>

            <th>Description</th>

            <th>Action</th>


        </tr>


        </thead>




        <tbody>


        <tr th:each="expense : ${expenses}">


            <td th:text="${expense.title}">
            </td>


            <td>
                ₹ <span th:text="${expense.amount}"></span>
            </td>


            <td th:text="${expense.category}">
            </td>


            <td th:text="${expense.date}">
            </td>


            <td th:text="${expense.description}">
            </td>



            <td>

                <a
                        th:href="@{/expenses/edit/{id}(id=${expense.id})}"
                        class="btn btn-warning btn-sm">

                    Edit

                </a>
                <a
                        th:href="@{/expenses/delete/{id}(id=${expense.id})}"
                        class="btn btn-danger btn-sm">

                    Delete

                </a>
                <a href="/expenses/pdf"
                   class="btn btn-danger">

                    📄 PDF

                </a>

                <a href="/expenses/excel"
                   class="btn btn-success">

                    📊 Excel

                </a>


            </td>



        </tr>


        </tbody>


    </table>



</div>

<script>


    const button =
    document.getElementById("themeToggle");



    button.onclick = function(){


    document.body.classList.toggle(
    "dark-mode"
    );



    if(
    document.body.classList.contains(
    "dark-mode"
    )
    ){


    localStorage.setItem(
    "theme",
    "dark"
    );


    button.innerHTML =
    "☀ Light Mode";


    }

    else{


    localStorage.setItem(
    "theme",
    "light"
    );


    button.innerHTML =
    "🌙 Dark Mode";


    }


    };



    // Load saved theme


    if(
    localStorage.getItem("theme")
    ==="dark"
    ){


    document.body.classList.add(
    "dark-mode"
    );


    button.innerHTML =
    "☀ Light Mode";


    }


</script>

</body>

</html>
