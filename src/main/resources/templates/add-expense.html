<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Add Expense</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

</head>


<body class="bg-light">


<div class="container mt-5">


    <h2 class="mb-4">
        Add New Expense
    </h2>


    <div class="card shadow p-4">


        <form th:action="@{/expenses/save}"
              th:object="${expense}"
              method="post">


            <div class="mb-3">

                <label>Title</label>

                <input type="text"
                       class="form-control"
                       th:field="*{title}"
                       required>

            </div>



            <div class="mb-3">

                <label>Amount</label>

                <input type="number"
                       class="form-control"
                       th:field="*{amount}"
                       required>

            </div>



            <div class="mb-3">

                <label>Category</label>


                <select class="form-control"
                        th:field="*{category}">


                    <option value="Food">
                        Food
                    </option>


                    <option value="Rent">
                        Rent
                    </option>


                    <option value="Travel">
                        Travel
                    </option>


                    <option value="Entertainment">
                        Entertainment
                    </option>


                    <option value="Other">
                        Other
                    </option>


                </select>

            </div>



            <div class="mb-3">

                <label>Date</label>


                <input type="date"
                       class="form-control"
                       th:field="*{date}">

            </div>




            <div class="mb-3">

                <label>Description</label>


                <textarea
                        class="form-control"
                        th:field="*{description}">
</textarea>


            </div>



            <button class="btn btn-success">

                Save Expense

            </button>


            <a href="/expenses"
               class="btn btn-secondary">

                Back

            </a>


        </form>


    </div>


</div>


</body>

</html>
