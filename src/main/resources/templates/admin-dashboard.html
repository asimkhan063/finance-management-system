<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Admin Dashboard</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

</head>


<body class="bg-light">


<div class="container mt-5">


    <h2 class="text-center">
        Admin Dashboard
    </h2>



    <div class="row mt-4">


        <div class="col-md-4">

            <div class="card bg-primary text-white">

                <div class="card-body">

                    <h5>Total Users</h5>

                    <h2 th:text="${dashboard.totalUsers}">
                    </h2>


                </div>

            </div>

        </div>



        <div class="col-md-4">

            <div class="card bg-danger text-white">

                <div class="card-body">

                    <h5>Total Expense</h5>

                    <h2>
                        ₹ <span th:text="${dashboard.totalExpense}">
</span>
                    </h2>


                </div>

            </div>

        </div>



        <div class="col-md-4">

            <div class="card bg-success text-white">

                <div class="card-body">

                    <h5>Total Income</h5>

                    <h2>
                        ₹ <span th:text="${dashboard.totalIncome}">
                          </span>
                    </h2>


                </div>

            </div>

        </div>

        <div class="text-center mt-4">

            <a href="/admin/users"
               class="btn btn-dark">

                Manage Users

            </a>

        </div>

</div>
</div>


</body>

</html>
