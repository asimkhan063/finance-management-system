<!DOCTYPE html>
<html>


<body>


<h2>
    Create New Password
</h2>


<form action="/reset-password" method="post">


    <input type="hidden"
           name="email"
           th:value="${email}">


    <input
            type="password"
            name="password"
            placeholder="New Password">


    <button>
        Change Password
    </button>


</form>


</body>


</html>
