<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>


<h2>
    Forgot Password
</h2>


<form action="/send-otp" method="post">


    <input
            type="email"
            name="email"
            placeholder="Enter Email"
            required>


    <button>
        Send OTP
    </button>


</form>


<p th:text="${error}"></p>


</body>

</html>
