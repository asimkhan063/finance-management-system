<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Income</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

</head>
<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow p-4">

        <h3>Add Income</h3>

        <form th:action="@{/income/save}"
              th:object="${income}"
              method="post">

            <div class="mb-3">
                <label>Title</label>
                <input
                        type="text"
                        class="form-control"
                        th:field="*{title}">
            </div>

            <div class="mb-3">
                <label>Amount</label>
                <input
                        type="number"
                        class="form-control"
                        th:field="*{amount}">
            </div>

            <div class="mb-3">
                <label>Source</label>
                <input
                        type="text"
                        class="form-control"
                        th:field="*{source}">
            </div>

            <div class="mb-3">
                <label>Date</label>
                <input
                        type="date"
                        class="form-control"
                        th:field="*{date}">
            </div>

            <div class="mb-3">
                <label>Description</label>
                <textarea
                        class="form-control"
                        th:field="*{description}">
                </textarea>
            </div>

            <button class="btn btn-success">

                Save Income

            </button>

        </form>

    </div>

</div>

</body>
</html>
