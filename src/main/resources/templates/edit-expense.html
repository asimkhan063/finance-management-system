<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Edit Expense</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

</head>


<body class="bg-light">


<div class="container mt-5">


    <h2>
        Edit Expense
    </h2>



    <div class="card shadow p-4">


        <form th:action="@{/expenses/update}"
              th:object="${expense}"
              method="post">


            <input type="hidden"
                   th:field="*{id}">



            <div class="mb-3">

                <label>
                    Title
                </label>


                <input type="text"
                       class="form-control"
                       th:field="*{title}">

            </div>



            <div class="mb-3">

                <label>
                    Amount
                </label>


                <input type="number"
                       class="form-control"
                       th:field="*{amount}">

            </div>




            <div class="mb-3">

                <label>
                    Category
                </label>


                <input type="text"
                       class="form-control"
                       th:field="*{category}">

            </div>




            <div class="mb-3">

                <label>
                    Date
                </label>


                <input type="date"
                       class="form-control"
                       th:field="*{date}">

            </div>




            <div class="mb-3">

                <label>
                    Description
                </label>


                <textarea
                        class="form-control"
                        th:field="*{description}">
</textarea>


            </div>




            <button class="btn btn-success">

                Update

            </button>


            <a href="/expenses"
               class="btn btn-secondary">

                Cancel

            </a>


        </form>


    </div>


</div>


</body>

</html>
