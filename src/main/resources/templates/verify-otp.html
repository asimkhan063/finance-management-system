<!DOCTYPE html>
<html>

<body>


<h2>
    Verify OTP
</h2>


<form action="/verify-otp" method="post">


    <input type="hidden"
           name="email"
           th:value="${email}">


    <input
            type="text"
            name="otp"
            placeholder="Enter OTP">


    <button>
        Verify
    </button>


</form>


</body>

</html>
