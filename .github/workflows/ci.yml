name: Java CI/CD

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: finance_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build
        run: mvn clean verify

      - name: Build Docker Image
        run: docker build -t finance-management-system .

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.asimkhan063 }}
          password: ${{ secrets.haidairali13 }}

      - name: Tag Image
        run: docker tag finance-management-system ${{ secrets.asimkhan063 }}/finance-management-system:latest

      - name: Push Image
        run: docker push ${{ secrets.asimkhan063 }}/finance-management-system:latest